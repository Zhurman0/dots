# Simple picom config to disable transparency and fading

backend = "xrender";  # or "glx" if you prefer OpenGL

# Disable all transparency
opacity-rule = [];

# Disable fading effects
fading = false;
fade-in-step = 0.0;
fade-out-step = 0.0;
fade-delta = 0;

# Disable shadows (optional)
shadow = false;

# Disable inactive window dimming
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Disable blur
blur-method = "none";

# VSync off for performance (optional)
vsync = false;
