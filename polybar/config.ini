[colors]
background = #D90E0F06
foreground = #AAB5BF
separator  = #233241
primary    = #495C6B
usable     = #72899C
alert      = #233241
disabled   = #C2C3C0


[bar/default]
width = 100%
height = 22pt
border-size = 3

bottom = false 

background = ${colors.background}
foreground = ${colors.foreground}

padding = 1

module-margin = 1
fixed-center = true

separator = |
separator-foreground = ${colors.separator}

font-0 = "Monospace:size=11"


[bar/top-left]
inherit = bar/default

monitor = ${env:MONITOR}

modules-left = empty workspaces
modules-center = date_day date_time calendar
modules-right = xkeyboard pulseaudio empty


[bar/bottom-left]
inherit = bar/default

monitor = ${env:MONITOR}

bottom = true

modules-left = empty netip netspeed
modules-center = systray
modules-right = cpu memory empty


[bar/top-right]
inherit = bar/default

monitor = ${env:MONITOR}

modules-left = empty workspaces reconfigure
modules-center = date_day date_time calendar
modules-right = xkeyboard pulseaudio empty


[bar/bottom-right]
inherit = bar/default

monitor = ${env:MONITOR}

bottom = true

modules-left = empty xwindow
modules-center = netip netspeed
modules-right = cpu memory empty


[module/systray]
type = internal/tray
tray-foreground = #362D70

format-margin = 2pt
tray-spacing = 2pt


[module/workspaces]
type = internal/i3

format = <label-state>

index-sort = true
wrapping-scroll = false
pin-workspaces = true
enable-scroll = false
show-urgent = true

label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-visible = %name%
label-visible-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2


[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false

format-volume = <label-volume>
format-volume-prefix = "Vol "
format-volume-prefix-foreground = ${colors.primary}

format-muted-prefix = "Vol "
format-muted-prefix-foreground = ${colors.primary}

label-volume = "%percentage:3%%"
label-muted = "----"

click-right = pavucontrol


[module/xkeyboard]
type = internal/xkeyboard

format = <label-layout> <label-indicator>
format-spacing = 0

format-prefix = Lng
format-prefix-foreground = ${colors.primary}

label-layout = " %icon%"
layout-icon-0 = us;EN
layout-icon-1 = ru;RU

label-indicator-on = %icon%
label-indicator-off = "-"
indicator-icon-0 = num lock;-;N
indicator-icon-1 = caps lock;-;C


[module/xwindow]
type = internal/xwindow

label = %class%
label-maxlen = 30
label-empty  = "Empty"


[module/memory]
type = internal/memory

interval = 5

format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}

label = %percentage_used:3%%


[module/cpu]
type = internal/cpu

interval = 2

format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}

label = %percentage:3%%


[module/calendar]
type = custom/text

label = Cal
label-foreground = ${colors.usable}

click-left = gsimplecal

[module/date_time]
type = internal/date

interval = 20

date = %I:%M%p
label = %date%
label-foreground = ${colors.foreground}


[module/date_day]
type = internal/date

interval = 3600

date = %a %d.%m
label = %date%
label-foreground = ${colors.foreground}


[module/netip]
type = internal/network

interface = enp5s0

format-connected-prefix = "IP "
format-connected-prefix-foreground = ${colors.primary}

label-connected = %local_ip%
label-disconnected = -


[module/netspeed]
type = internal/network

interface = enp5s0

format-connected-prefix = "DL/UL "
format-connected-prefix-foreground = ${colors.primary}

speed-unit =
label-connected =  %downspeed:5%/%upspeed:5%
label-disconnected = -


[module/reconfigure]
type = custom/text

label = 

click-left = sh -c startpanel.sh


[module/empty]
type = custom/text

label = " "


[settings]
screenchange-reload = true
pseudo-transparency = true
